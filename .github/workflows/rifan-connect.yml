name: RIFAN Connect checks

on:
  push:
    branches: [main]
    paths:
      - 'rifan-app/**'
      - '.github/workflows/rifan-connect.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - '.node-version'
      - 'render.yaml'
      - 'render.postgres.yaml'
      - 'scripts/prepare-render.mjs'
  pull_request:
    paths:
      - 'rifan-app/**'
      - '.github/workflows/rifan-connect.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - '.node-version'
      - 'render.yaml'
      - 'render.postgres.yaml'
      - 'scripts/prepare-render.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rifan_test
          POSTGRES_PASSWORD: rifan-test-only
          POSTGRES_DB: rifan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rifan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: rifan-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rifan-app/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run test:postgres
        env:
          RIFAN_TEST_POSTGRES_URL: postgresql://rifan_test:rifan-test-only@127.0.0.1:5432/rifan_test?sslmode=disable
      - run: npm run build
      - run: npm run test:deployment
